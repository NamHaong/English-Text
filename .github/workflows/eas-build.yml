name: iOS Build (unsigned IPA)

# Build file .ipa KHÔNG ký trên macOS runner của GitHub (không cần Apple Developer, không cần EXPO_TOKEN).
# Chạy tay: Actions > iOS Build (unsigned IPA) > Run workflow. Tải .ipa ở mục Artifacts, tự ký/cài bằng công cụ riêng.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src

      - name: Generate native iOS project (prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: Configure Expo.plist for EAS Update
        run: |
          PLIST=$(find ios -name "Expo.plist" | head -n 1)
          echo "Found Expo.plist at: $PLIST"
          /usr/libexec/PlistBuddy -c "Add :EXUpdatesRequestHeaders dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :EXUpdatesRequestHeaders:expo-channel-name string preview" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :EXUpdatesRequestHeaders:expo-channel-name preview" "$PLIST" || true
          cat "$PLIST"

      - name: Pre-download React Native artifacts with retry
        run: |
          CACHE_DIR="$HOME/Library/Caches/ReactNative"
          mkdir -p "$CACHE_DIR"
          DEBUG_URL="https://repo.reactnative.dev/maven2/com/facebook/react/react-native-artifacts/0.88.1/react-native-artifacts-0.88.1-reactnative-dependencies-debug.tar.gz"
          RELEASE_URL="https://repo.reactnative.dev/maven2/com/facebook/react/react-native-artifacts/0.88.1/react-native-artifacts-0.88.1-reactnative-dependencies-release.tar.gz"
          echo "Pre-downloading React Native 0.88.1 dependencies with curl retry..."
          curl -A "react-native-0.88.1" --retry 10 --retry-delay 3 --retry-connrefused -C - -Lo "$CACHE_DIR/reactnative-dependencies-0.88.1-debug.tar.gz" "$DEBUG_URL" || true
          curl -A "react-native-0.88.1" --retry 10 --retry-delay 3 --retry-connrefused -C - -Lo "$CACHE_DIR/reactnative-dependencies-0.88.1-release.tar.gz" "$RELEASE_URL" || true
          ls -lh "$CACHE_DIR"

      - name: Install CocoaPods
        working-directory: ios
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i: running pod install..."
            pod install && break || { echo "Attempt $i failed, retrying in 5 seconds..."; sleep 5; }
          done

      - name: Build (no code signing)
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME"
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 40

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ../eng-text-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: eng-text-unsigned-ipa
          path: eng-text-unsigned.ipa
          retention-days: 14
